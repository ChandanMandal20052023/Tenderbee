name: AI/ML Tests & Golden Set CI Gate

on:
  push:
    branches: [main, 'ai/**']
    paths:
      - 'backend/engine/**'
      - 'backend/services/**'
      - 'backend/golden/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/engine/**'
      - 'backend/services/**'
      - 'backend/golden/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic>=2.6 rapidfuzz>=3.0 pypdf>=4.0 pytest>=8.0 httpx>=0.27
      
      - name: Run engine unit tests
        run: pytest backend/engine/tests/ -v --tb=short
      
      - name: Run golden set CI gate
        run: pytest backend/golden/ -v --tb=long -x
        # -x: stop on first failure (fail fast on CI gate violations)
